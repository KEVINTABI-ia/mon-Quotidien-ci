name = "mon-quotidien-jeko"
main = "cloudflare/worker.js"
compatibility_date = "2024-09-23"
workers_dev = true
preview_urls = false
keep_vars = true

[[r2_buckets]]
binding = "PUBLICITES_R2"
bucket_name = "mon-quotidien-ci-publicites"

[observability]
enabled = true

[secrets]
required = [
  "FIREBASE_API_KEY",
  "GOOGLE_SERVICE_ACCOUNT_JSON",
  "JEKO_API_KEY",
  "JEKO_API_KEY_ID",
  "JEKO_STORE_ID",
  "JEKO_WEBHOOK_SECRET"
]
