name: Payment backend tests

on:
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/payment-tests.yml"
  push:
    branches:
      - main
      - feat/paiements-securises-wave-orange
    paths:
      - "functions/**"
      - ".github/workflows/payment-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test
