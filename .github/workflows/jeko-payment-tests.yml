name: Jèko payment tests
on:
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/jeko-payment-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/jeko-payment-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test
      - run: |
          node --check src/index.js
          node --check src/payment-utils.js
