name: Firestore Rules Tests

on:
  push:
    branches: [main, feature-securiser-terrain-qr-idufci]
  pull_request:
    branches: [main, feature-securiser-terrain-qr-idufci]

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Report npm dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) { console.log("\\n" + name + " | " + v.severity + " | installed=" + (v.nodes || []).join(", ") + " | fixAvailable=" + JSON.stringify(v.fixAvailable)); for (const item of (v.via || [])) { if (typeof item === "string") console.log("  via dependency: " + item); else console.log("  advisory: " + item.title + " | range=" + item.range + " | url=" + item.url); } }'
      - name: Check inline JavaScript syntax
        run: node tests/check-inline-scripts.js
      - name: Run Firestore emulator tests
        run: npm test
